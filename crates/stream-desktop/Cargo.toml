[package]
name = "stream-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Stream desktop application: a thin presentation layer over the Stream AppPort surface."

[[bin]]
name = "stream-desktop"
path = "src/main.rs"

[features]
default = ["native"]
# A native window with the system webview (WKWebView, WebView2, WebKitGTK).
# Without it, `stream-desktop` serves the same UI on localhost.
native = ["dep:wry", "dep:tao", "dep:open"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
stream-appport = { path = "../stream-appport" }
tokio.workspace = true
uuid.workspace = true
open = { version = "5", optional = true }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
reqwest.workspace = true
stream-testkit = { path = "../stream-testkit" }
