[workspace]
members = [
  "crates/stream-model",
  "crates/stream-core",
  "crates/stream-ingest",
  "crates/stream-rss",
  "crates/stream-web",
  "crates/stream-semantic",

  "crates/stream-query",
  "crates/stream-rules",
  "crates/stream-appport",
  "crates/stream-cli",
  "crates/stream-desktop",
  "crates/stream-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
rss = "2.0"
atom_syndication = "0.12"
jsonfeed = "0.2"
scraper = "0.20"
